services:
  sticker-engine:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      OUTPUT_DIR: /data/output
      DB_URL: sqlite+aiosqlite:////data/engine.db
      U2NET_HOME: /data/models
    volumes:
      - engine-data:/data   # database, generated images and the background-removal model survive restarts
    restart: unless-stopped

volumes:
  engine-data:
